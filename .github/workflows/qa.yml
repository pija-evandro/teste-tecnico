name: QA Automation

on:
  push:
    branches:
      - main
      - master
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

jobs:
  cypress:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress
        uses: cypress-io/github-action@v7
        with:
          install: false
          command: npm test
        env:
          CYPRESS_trelloKey: ${{ secrets.TRELLO_KEY }}
          CYPRESS_trelloToken: ${{ secrets.TRELLO_TOKEN }}

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-test-artifacts
          path: |
            cypress/screenshots
            cypress/videos
            reports
          if-no-files-found: ignore
