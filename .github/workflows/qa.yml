name: QA Automation

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

jobs:
  cypress:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        uses: cypress-io/github-action@v7
        with:
          install: false
          command: npm run test:api
        env:
          CYPRESS_trelloKey: ${{ secrets.TRELLO_KEY }}
          CYPRESS_trelloToken: ${{ secrets.TRELLO_TOKEN }}
        
      - name: Check Automation Exercise availability
        id: automation-exercise
        shell: bash
        run: |
          ui_status=$(curl --silent --show-error --location --max-redirs 5 --connect-timeout 10 --max-time 30 --output /tmp/automation-exercise-ui.html --write-out "%{http_code}" https://www.automationexercise.com/products || true)

          api_status=$(curl --silent --show-error --location --max-redirs 5 --connect-timeout 10 --max-time 30 --output /tmp/automation-exercise-api.json --write-out "%{http_code}" https://www.automationexercise.com/api/productsList || true)

          [ -n "$ui_status" ] || ui_status="000"
          [ -n "$api_status" ] || api_status="000"

          ui_valid=false
          api_valid=false

          if [ "$ui_status" = "200" ] && grep -qi "All Products" /tmp/automation-exercise-ui.html; then
            ui_valid=true
          fi

          if [ "$api_status" = "200" ] && node -e 'const fs=require("fs"); try { const body=JSON.parse(fs.readFileSync("/tmp/automation-exercise-api.json","utf8")); process.exit(body && Array.isArray(body.products) ? 0 : 1); } catch { process.exit(1); }'; then
            api_valid=true
          fi

          echo "ui_status=$ui_status" >> "$GITHUB_OUTPUT"
          echo "api_status=$api_status" >> "$GITHUB_OUTPUT"
          echo "ui_valid=$ui_valid" >> "$GITHUB_OUTPUT"
          echo "api_valid=$api_valid" >> "$GITHUB_OUTPUT"

          if [ "$ui_valid" = "true" ] && [ "$api_valid" = "true" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Automation Exercise is available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Automation Exercise returned an invalid or blocked response."
            echo "UI status: $ui_status | Valid content: $ui_valid"
            echo "API status: $api_status | Valid JSON: $api_valid"
          fi
            
      - name: Run Web tests
        if: steps.automation-exercise.outputs.available == 'true'
        uses: cypress-io/github-action@v7
        with:
          install: false
          command: npm run test:web

      - name: Report unavailable Web environment
        if: steps.automation-exercise.outputs.available != 'true'
        shell: bash
        run: |
          echo "### Web tests not executed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Automation Exercise was unavailable from the GitHub runner." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- UI status: ${{ steps.automation-exercise.outputs.ui_status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- API status: ${{ steps.automation-exercise.outputs.api_status }}" >> "$GITHUB_STEP_SUMMARY"
          
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-test-artifacts
          path: |
            cypress/screenshots
            cypress/videos
            reports
          if-no-files-found: ignore
